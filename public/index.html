<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HQ · XX + ZZ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F17'/%3E%3Ccircle cx='12' cy='16' r='4' fill='%23E7B45A'/%3E%3Ccircle cx='20' cy='16' r='4' fill='%238FD3FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dots"><i class="xx"></i><i class="zz"></i></span>
    <div>
      <h1>HQ</h1>
      <p class="sub">Boss · XX · ZZ — every project and what changed</p>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="bar">
  <div class="chips" role="group" aria-label="Who">
    <button class="chip on" data-who="all">All</button>
    <button class="chip" data-who="XX"><i class="dot xx"></i>XX</button>
    <button class="chip" data-who="ZZ"><i class="dot zz"></i>ZZ</button>
  </div>
  <input id="q" type="search" placeholder="Search updates…" autocomplete="off">
</div>

<main>
  <section class="latest">
    <h2>Latest across everything</h2>
    <ol id="latest" class="feed"></ol>
  </section>
  <section>
    <h2>Projects</h2>
    <div id="grid" class="grid"></div>
  </section>
  <p id="err" class="err" hidden></p>
</main>

<footer>Private · updated by git push from XX and ZZ · <span id="gen"></span></footer>
<script src="app.js"></script>
</body>
</html>
