<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0F17">
<title>HQ · XX + ZZ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0F17'/%3E%3Ccircle cx='12' cy='16' r='5' fill='%23E7B45A'/%3E%3Ccircle cx='20' cy='16' r='5' fill='%238FD3FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Projects">
    <a class="brand" href="#">
      <span class="dots"><i class="xx"></i><i class="zz"></i></span>
      <span><b>HQ</b><small>Boss · XX · ZZ</small></span>
    </a>
    <nav id="nav" class="nav"></nav>
  </aside>

  <div class="main">
    <div class="bar">
      <div class="chips" role="group" aria-label="Show updates by">
        <button class="chip on" data-who="all">Everyone</button>
        <button class="chip" data-who="XX"><i class="dot xx"></i>XX</button>
        <button class="chip" data-who="ZZ"><i class="dot zz"></i>ZZ</button>
      </div>
      <label class="search"><span class="sr">Search</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13.5 13.5 18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search all updates" autocomplete="off">
      </label>
    </div>
    <main id="view" tabindex="-1"></main>
    <footer>Private · XX and ZZ update this by git push · times in Malaysia time · <span id="gen"></span></footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
